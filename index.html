<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aline's BestellApp</title>

    <link rel="shortcut icon" href="./assets/icons/Salad.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/headooter.css">
    <link rel="stylesheet" href="./styles/cart.css">
    <link rel="stylesheet" href="./styles/menu.css">

    <script src="./scripts/menu-db.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
    <script src="./main.js" defer></script>
    <script src="./scripts/test.js"></script>


</head>
<body onload="init()">
    <header>
        <div class="content-headooter" id="header-content">
            <img src="./assets/icons/logo-bestellapp.png" alt="logo bestellapp">
            <nav>
                <img src="./assets/icons/icon-burger-menu.png" alt="navigation menu icon">
            </nav>
        </div>
    </header>
    <main>
        <section>
            <div class="content" id="landing-section">
<!--                 <img src="./assets/images/vegang-vegan-meal.png" alt="photo vegang speise" id="background-image"> -->
                <img src="./assets/icons/logo-vegang.png" alt="logo vegang berlin" id="logo">
                <div id="restaurant-info">
                    <div id="restaurant-name-rating">
                        <h1>Vegang Berlin</h1>
                        <div id="ratings">
                            <p id="rating-average">&starf;4,9</p>
                            <p id="total-ratings">(1.598)</p>
                        </div>
                    </div>
                    <h3>Aline's favourite vegan restaurant.</h3>
                </div>
            </div>
        </section>
        <section>
            <div class="content" id="content-wrapper">
                <section id="menu">
                    <h2>Menu</h2>
                    <div id="menu-items-wrapper">
                        <p>test</p>
                        <!-- generated by JS -->
                    </div>
                </section>
                <section id="cart-wrapper">
                    <div id="cart">
                        <!-- generated by JS -->
                    </div>
                </section>
                <dialog id="order-confirmation-popup">

                </dialog>
            </div>
        </section>
    </main>
    <footer>
        <div class="content-headooter" id="footer-links">
            <a href="https://www.vegangberlin.de" target="_blank" rel="noopener noreferrer">&#169; 2026 Vegang Berlin (by Aline)</a>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
</body>
</html>
