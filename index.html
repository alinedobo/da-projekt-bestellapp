<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alines Bestellapp</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/standard.css">

    <script src="./scripts/db.js" defer></script>
    <script src="./main.js" defer></script>
    <script src="./scripts/templates.js" defer></script>


</head>
<body>
    <header>
        <img src="" alt="">
        <nav></nav>
    </header>
    <main>
        <section id="landing-section">
            <img src="./assets/images/vegang-vegan-meal.png" alt="photo from a vegan meal fron vegang">
            <div id="restaurant-info">
                <h1>Alines Vegane Speisen</h1>
                <div id="ratings">Tartings</div>
                <h3>Alines vegane Speisen zum kleinen Preis.</h3>
            </div>
        </section>
        <section id="content-wrapper">
            <section id="menu">
                <h2>Menu</h2>
                <div id="menu-items">
                    <!-- generated by JS -->
                </div>
            </section>
            <section id="cart-wrapper">
                <div id="cart">
                    <!-- generated by JS -->
                </div>
            </section>
        </section>
    </main>
    <footer>
        <div></div>
        <div></div>
        <div></div>
    </footer>
    
</body>
</html>
