<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aline's BestellApp</title>

    <link rel="shortcut icon" href="./assets/icons/Salad.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/headooter.css">
    <link rel="stylesheet" href="./styles/cart.css">
    <link rel="stylesheet" href="./styles/menu.css">

    <script src="./scripts/menu-db.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
    <script src="./main.js" defer></script>
    <script src="./scripts/test.js"></script>


</head>
<body onload="init()">
    <header>
        <img src="./assets/icons/logo-bestellapp.png" alt="logo bestellapp">
        <nav>
            <img src="./assets/icons/icon-burger-menu.png" alt="navigation menu icon">
        </nav>
    </header>
    <main>
        <section id="landing-section">
            <img src="./assets/images/vegang-vegan-meal.png" alt="photo vegang speise">
            <div id="restaurant-info">
                <h1>Aline's favourite vegan Restaurant</h1>
                <div id="ratings">Ratings</div>
                <h3>Delicious vegan meals.</h3>
            </div>
        </section>
        <section id="content-wrapper">
            <section id="menu">
                <h2>Menu</h2>
                <div id="menu-items-wrapper">
                    <p>test</p>
                    <!-- generated by JS -->
                </div>
            </section>
            <section id="cart-wrapper">
                <div id="cart">
                    <!-- generated by JS -->
                </div>
            </section>
        </section>
    </main>
    <footer>
        <div></div>
        <div></div>
        <div></div>
    </footer>
    
</body>
</html>
